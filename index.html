<script>

/* =========================================
   APK DOWNLOAD URL
   =========================================

   IMPORTANT:
   Yahan apne APK ka DIRECT HTTPS URL daalo.

   Example:
   https://yourdomain.com/app.apk

*/
const APK_URL = "https://YOUR-DOMAIN.COM/app.apk";


function downloadAPK(){

    /* Meta Pixel */
    try{
        if(typeof fbq !== "undefined"){
            fbq('track','Subscribe');
        }
    }catch(e){
        console.log(e);
    }


    /*
       APK download/open
    */

    const link = document.createElement("a");

    link.href = APK_URL;

    link.setAttribute(
        "download",
        "AMBANI_TOOL.apk"
    );

    link.target = "_blank";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}


/* COUNTDOWN */

let timeLeft = 20;

const timerEl =
document.getElementById("timer");

setInterval(function(){

    timeLeft--;

    if(timeLeft < 0){
        timeLeft = 20;
    }

    timerEl.textContent =
    "00:" +
    (timeLeft < 10 ? "0" : "") +
    timeLeft;

},1000);

</script>
